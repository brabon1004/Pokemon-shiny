name: Build and deploy

# The live site always builds from `prod`. Day-to-day work happens on `main`, which never deploys.
on:
  push:
    branches: [prod]
  # Every 4 hours, off the top of the hour to avoid the scheduler's busiest minute.
  # GitHub runs schedules from the default branch, so checkout below pins `prod` explicitly.
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Queue rather than cancel, so a scheduled data refresh never aborts a deploy already in progress.
concurrency:
  group: deploy
  cancel-in-progress: false

# Actions are pinned to commit SHAs (tag in the comment) so a moved tag can't change what runs.
jobs:
  # Runs all third-party code (npm packages, upstream data) and never sees the Cloudflare secrets.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: prod
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Writes public/data/combined.json, which Vite copies into dist/data/.
      # If this fails, nothing is uploaded and the last good deploy stays live.
      - run: npm run build:data
      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Only uploads the built files. A fresh runner, so nothing from the build job can read the token.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      # Cloudflare Pages project `shiny-tracker-go`, production branch `prod`: https://shiny-tracker-go.pages.dev
      # Wrangler is pinned so a new release can't change how the deploy behaves without a reviewed bump.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.165.0'
          command: pages deploy dist --project-name=shiny-tracker-go --branch=prod
